# dsh-artifacts bundle patch：全局产物收藏夹（host 半部）。
# 纯 insert（id/name），经 profile bundles 列表应用；client 半部由 package.json 的
# dsh.client 声明自动进浏览器 roster。存储目录 ~/.dsh/artifacts 不在此写死——
# config.root 可覆盖，默认跟随用户主目录（历史教训见 dsh-sticker：patch 不硬编码机器路径）。
- insert:
    - id: dsh-artifacts
      name: '@modusensus/dsh-artifacts'
      config: {}
